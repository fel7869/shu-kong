<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数控车间闯关 · K2000GtC V2 编程学习游戏</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330;
    --line:#2b3444; --txt:#e6edf3; --muted:#8b98a9;
    --accent:#00d1b2; --accent2:#3fa7ff; --gold:#ffce54;
    --ok:#2ecc71; --bad:#ff5d5d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:radial-gradient(1200px 700px at 70% -10%,#13233a 0%,var(--bg) 55%);
    color:var(--txt); min-height:100vh; display:flex; justify-content:center;
    padding:18px;
  }
  .app{width:100%;max-width:720px}
  header{text-align:center;margin-bottom:14px}
  header h1{font-size:22px;letter-spacing:1px}
  header p{color:var(--muted);font-size:13px;margin-top:4px}
  .card{
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border:1px solid var(--line); border-radius:16px; padding:20px;
    box-shadow:0 12px 40px rgba(0,0,0,.4);
  }
  /* 进度机床 */
  .machine{margin:0 0 16px}
  .machine .bartop{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
  .track{position:relative;height:26px;background:#0a0e14;border:1px solid var(--line);border-radius:20px;overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .5s ease;border-radius:20px}
  .tool{position:absolute;top:-9px;font-size:20px;transition:left .5s ease;transform:translateX(-50%)}
  .levels-row{display:flex;justify-content:space-between;margin-top:10px;gap:4px}
  .lv-dot{flex:1;text-align:center;font-size:11px;color:var(--muted);padding:6px 2px;border-radius:8px;border:1px solid transparent}
  .lv-dot.active{color:var(--accent);border-color:var(--accent);background:rgba(0,209,178,.08)}
  .lv-dot.done{color:var(--ok)}
  .lv-dot .ic{font-size:16px;display:block}

  h2.title{font-size:18px;margin-bottom:4px}
  .sub{color:var(--accent2);font-size:12px;margin-bottom:14px}
  .intro{background:#0f1621;border-left:3px solid var(--accent);padding:12px 14px;border-radius:8px;color:#c7d1de;font-size:14px;line-height:1.6;margin-bottom:18px}

  .q{font-size:16px;line-height:1.6;margin-bottom:16px;font-weight:600}
  .q .qnum{color:var(--gold);margin-right:6px}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;align-items:center;gap:10px;background:#0f1621;border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;cursor:pointer;font-size:15px;transition:.15s;
  }
  .opt:hover{border-color:var(--accent2);background:#12203a}
  .opt .tag{width:24px;height:24px;flex:none;border-radius:6px;background:#222c3a;display:grid;place-items:center;font-size:13px;color:var(--muted)}
  .opt.correct{border-color:var(--ok);background:rgba(46,204,113,.12)}
  .opt.correct .tag{background:var(--ok);color:#04210f}
  .opt.wrong{border-color:var(--bad);background:rgba(255,93,93,.12)}
  .opt.wrong .tag{background:var(--bad);color:#2a0606}
  .opt.disabled{pointer-events:none;opacity:.85}

  .exp{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.6;display:none}
  .exp.show{display:block}
  .exp.ok{background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.4)}
  .exp.no{background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.4)}
  .exp b{color:var(--gold)}

  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
  .stat{font-size:13px;color:var(--muted)}
  .stat b{color:var(--txt)}
  button.btn{
    background:linear-gradient(90deg,var(--accent),var(--accent2));color:#04210f;border:none;
    padding:11px 22px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;
  }
  button.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
  button.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}

  /* 关卡完成 / 结算 */
  .center{text-align:center;padding:10px 0}
  .big{font-size:46px;margin:8px 0}
  .center h2{font-size:22px;margin-bottom:8px}
  .center p{color:var(--muted);line-height:1.7;margin-bottom:6px}
  .score-badge{display:inline-block;background:#0f1621;border:1px solid var(--gold);color:var(--gold);
    padding:8px 18px;border-radius:30px;font-size:18px;font-weight:700;margin:12px 0}
  .rank{font-size:20px;color:var(--accent);font-weight:700;margin:10px 0}
  .hidden{display:none}
  @media(max-width:520px){
    .lv-dot span.nm{display:none}
    header h1{font-size:18px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🏭 数控车间闯关</h1>
    <p>基于《K2000GtC V2 编程手册》· 边玩边学 CNC 编程</p>
  </header>

  <div class="card">
    <!-- 进度机床 -->
    <div class="machine">
      <div class="bartop"><span>加工进度</span><span id="progTxt">0%</span></div>
      <div class="track">
        <div class="fill" id="fill"></div>
        <div class="tool" id="tool" style="left:0%">🔧</div>
      </div>
      <div class="levels-row" id="lvRow"></div>
    </div>

    <!-- 屏幕区 -->
    <div id="screen"></div>
  </div>
</div>

<script src="questions.js"></script>
<script>
const screen = document.getElementById('screen');
const fill = document.getElementById('fill');
const tool = document.getElementById('tool');
const progTxt = document.getElementById('progTxt');
const lvRow = document.getElementById('lvRow');

let state = {
  levelIdx: 0,
  qIdx: 0,
  correct: 0,
  total: 0,
  answeredThisLevel: 0,
  correctThisLevel: 0,
  locked: false
};

const TOTAL_Q = LEVELS.reduce((s,l)=>s+l.questions.length,0);

function buildLvRow(){
  lvRow.innerHTML = '';
  LEVELS.forEach((l,i)=>{
    const d = document.createElement('div');
    d.className = 'lv-dot' + (i===state.levelIdx?' active':'') + (i<state.levelIdx?' done':'');
    d.innerHTML = `<span class="ic">${i<state.levelIdx?'✅':l.icon}</span><span class="nm">第${l.id}关</span>`;
    lvRow.appendChild(d);
  });
}

function updateProgress(){
  const done = state.total;
  const pct = Math.round(done/TOTAL_Q*100);
  fill.style.width = pct+'%';
  tool.style.left = pct+'%';
  progTxt.textContent = pct+'%';
}

function renderStart(){
  buildLvRow();
  screen.innerHTML = `
    <div class="center">
      <div class="big">🏭</div>
      <h2>欢迎来到数控车间</h2>
      <p>你是一名 K2000GtC V2 数控系统的程序员学徒。</p>
      <p>共 <b style="color:#fff">5 个关卡</b> · <b style="color:#fff">${TOTAL_Q} 道题</b>，覆盖 G代码、坐标系、S/T/M 功能、固定循环与宏程序。</p>
      <p>每答对一题，机床就前进一步，加工出你的第一个零件！</p>
      <div style="margin-top:20px"><button class="btn" onclick="startGame()">🚀 进入车间</button></div>
    </div>`;
}

function startGame(){
  state.levelIdx = 0; state.qIdx = 0; state.correct = 0; state.total = 0;
  renderLevelIntro();
}

function renderLevelIntro(){
  const lv = LEVELS[state.levelIdx];
  state.correctThisLevel = 0; state.answeredThisLevel = 0; state.qIdx = 0;
  buildLvRow();
  screen.innerHTML = `
    <div class="center">
      <div class="big">${lv.icon}</div>
      <h2>${lv.name}</h2>
      <div class="sub" style="text-align:center">${lv.subtitle}</div>
      <div class="intro" style="text-align:left">${lv.intro}</div>
      <button class="btn" onclick="renderQuestion()">开始本关 ▶</button>
    </div>`;
}

function renderQuestion(){
  state.locked = false;
  const lv = LEVELS[state.levelIdx];
  const item = lv.questions[state.qIdx];
  buildLvRow();
  const optsHtml = item.options.map((o,i)=>`
    <div class="opt" data-i="${i}" onclick="choose(${i})">
      <div class="tag">${String.fromCharCode(65+i)}</div>
      <div>${o}</div>
    </div>`).join('');
  screen.innerHTML = `
    <h2 class="title">${lv.icon} ${lv.name}</h2>
    <div class="sub">${lv.subtitle} · 第 ${state.qIdx+1}/${lv.questions.length} 题</div>
    <div class="q"><span class="qnum">Q${state.qIdx+1}.</span>${item.q}</div>
    <div class="opts" id="opts">${optsHtml}</div>
    <div class="exp" id="exp"></div>
    <div class="footer">
      <div class="stat">总得分 <b>${state.correct}</b> / ${state.total} 已答 · 全程 ${TOTAL_Q} 题</div>
      <button class="btn" id="nextBtn" disabled onclick="nextQuestion()">下一题 →</button>
    </div>`;
  updateProgress();
}

function choose(i){
  if(state.locked) return;
  state.locked = true;
  const lv = LEVELS[state.levelIdx];
  const item = lv.questions[state.qIdx];
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o=>o.classList.add('disabled'));
  const correct = item.answer;
  const isRight = i===correct;

  opts[correct].classList.add('correct');
  if(!isRight) opts[i].classList.add('wrong');

  state.total++; state.answeredThisLevel++;
  if(isRight){ state.correct++; state.correctThisLevel++; }

  const exp = document.getElementById('exp');
  exp.className = 'exp show ' + (isRight?'ok':'no');
  exp.innerHTML = (isRight
    ? '✅ <b>正确！</b> ' : '❌ <b>再记一下：</b> ') + item.exp;

  document.getElementById('nextBtn').disabled = false;
  updateProgress();
}

function nextQuestion(){
  const lv = LEVELS[state.levelIdx];
  if(state.qIdx < lv.questions.length-1){
    state.qIdx++;
    renderQuestion();
  } else {
    renderLevelDone();
  }
}

function renderLevelDone(){
  const lv = LEVELS[state.levelIdx];
  const c = state.correctThisLevel, t = lv.questions.length;
  const perfect = c===t;
  const isLast = state.levelIdx === LEVELS.length-1;
  const emoji = perfect ? '🌟' : (c/t>=0.6 ? '👍' : '💪');
  const msg = perfect ? '满分通关！加工精度完美！'
             : (c/t>=0.6 ? '顺利过关，零件合格！' : '过关了，但还有毛刺，回头可再练习。');
  buildLvRow();
  screen.innerHTML = `
    <div class="center">
      <div class="big">${emoji}</div>
      <h2>${lv.name} 完成</h2>
      <div class="score-badge">本关 ${c} / ${t} 正确</div>
      <p>${msg}</p>
      ${isLast ? '' : '<p>下一关：<b style="color:#fff">'+LEVELS[state.levelIdx+1].name+'</b></p>'}
      <div style="margin-top:18px">
        <button class="btn ghost" onclick="reviewLevel()" style="margin-right:8px">↻ 重做本关</button>
        <button class="btn" onclick="afterLevel()">${isLast?'查看结算 🏆':'进入下一关 ▶'}</button>
      </div>
    </div>`;
}

function reviewLevel(){
  // 重做本关：扣掉本关已计入的分数与题数
  state.correct -= state.correctThisLevel;
  state.total -= state.answeredThisLevel;
  renderLevelIntro();
}

function afterLevel(){
  if(state.levelIdx < LEVELS.length-1){
    state.levelIdx++;
    renderLevelIntro();
  } else {
    renderFinal();
  }
}

function rankOf(pct){
  if(pct>=95) return {t:'🏆 数控大师',d:'你已吃透这本手册，可以独立编写复杂加工程序！'};
  if(pct>=80) return {t:'🥇 高级程序员',d:'基础扎实，稍加实战即可上手真实机床。'};
  if(pct>=60) return {t:'🥈 合格操作工',d:'核心概念已掌握，建议重刷错题巩固。'};
  return {t:'🥉 车间学徒',d:'别灰心，回炉再学一遍，你会进步很快！'};
}

function renderFinal(){
  const pct = Math.round(state.correct/TOTAL_Q*100);
  const r = rankOf(pct);
  buildLvRow();
  screen.innerHTML = `
    <div class="center">
      <div class="big">🏁</div>
      <h2>全部通关！零件加工完成</h2>
      <div class="score-badge">总成绩 ${state.correct} / ${TOTAL_Q} （${pct}%）</div>
      <div class="rank">${r.t}</div>
      <p>${r.d}</p>
      <p style="margin-top:14px;color:#c7d1de">你已系统复习了 G代码、坐标系、S/T/M 功能、固定循环与宏程序 B 的核心知识。</p>
      <div style="margin-top:20px">
        <button class="btn" onclick="startGame()">🔄 再玩一次</button>
      </div>
    </div>`;
  updateProgress();
}

// 启动
renderStart();
</script>
</body>
</html>
